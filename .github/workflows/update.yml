name: 🔄 Update VPN Subscription

on:
  # Запуск каждый день в 06:00 и 18:00 UTC (09:00 и 21:00 МСК)
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 18 * * *'

  # Ручной запуск
  workflow_dispatch:

  # При пуше (для первого запуска)
  push:
    branches: [main]
    paths:
      - 'update.py'
      - '.github/workflows/update.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install dependencies
        run: pip install aiohttp pyyaml

      - name: 🔄 Run update
        run: python update.py

      - name: 📊 Show results
        run: |
          echo "=== Subscription size ==="
          wc -c subscription.txt
          echo ""
          echo "=== Server count ==="
          python3 -c "
          import json
          meta = json.load(open('servers_meta.json'))
          stats = meta['stats']
          print(f'Total: {stats[\"total\"]}')
          print(f'Added today: {stats[\"added_today\"]}')
          print(f'Countries: {len(stats[\"countries\"])}')
          for k,v in sorted(stats['protocols'].items(), key=lambda x: -x[1]):
              print(f'  {k}: {v}')
          "

      - name: 📤 Commit & Push
        run: |
          git config user.name "VPN Auto-Updater"
          git config user.email "bot@github.com"
          git add subscription.txt raw_configs.txt servers_meta.json README.md
          git diff --staged --quiet || git commit -m "🔄 Update $(date -u +%Y-%m-%d): $(python3 -c "import json; d=json.load(open('servers_meta.json')); print(f\"{d['stats']['total']} servers, +{d['stats']['added_today']} new\")")"
          git push
