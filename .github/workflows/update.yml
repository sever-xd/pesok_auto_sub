name: 🔄 Update VPN Subscription

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'update.py'
      - '.github/workflows/update.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install dependencies
        run: pip install aiohttp pyyaml

      - name: 🔄 Run update & ping test
        run: python update.py

      - name: 📊 Show results
        run: |
          echo "=== Stats ==="
          python3 -c "
          import json
          meta = json.load(open('servers_meta.json'))
          stats = meta['stats']
          print(f'Total: {stats[\"total\"]}')
          print(f'Added today: {stats[\"added_today\"]}')
          print(f'Online: {len([s for s in meta[\"servers\"] if s.get(\"ping\",0) > 0])}')
          print(f'Countries: {len(stats[\"countries\"])}')
          for k,v in sorted(stats['protocols'].items(), key=lambda x: -x[1]):
              print(f'  {k}: {v}')
          "

      - name: 📤 Commit & Push
        run: |
          git config user.name "VPN Auto-Updater"
          git config user.email "bot@github.com"
          git add subscription.txt raw_configs.txt servers_meta.json site_data.json README.md
          git diff --staged --quiet || git commit -m "🔄 Update $(date -u +%Y-%m-%d): $(python3 -c "import json; d=json.load(open('servers_meta.json')); s=d['stats']; print(f\"{s['total']} servers, +{s['added_today']} new\")")"
          git push

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 🔄 Pull latest
        run: git pull origin main

      - name: 📦 Setup Pages
        uses: actions/configure-pages@v4

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
